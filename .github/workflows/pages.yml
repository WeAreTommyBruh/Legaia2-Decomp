# Builds the project website (site/) from report/report.json and publishes it on GitHub Pages.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'report/report.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build_site.py
      - run: mkdir _site && cp site/index.html _site/index.html && cp -r site/assets _site/assets && rm -f _site/assets/lang.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
